<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>옷라벨 - SPA 브랜드 소재 & 혼용률 맞대결 비교</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .accordion-content {
      transition: max-height 0.35s ease-out, opacity 0.25s ease-in-out;
    }
    .sponsor-glow {
      background: linear-gradient(135deg, rgba(255,237,213,0.5) 0%, rgba(255,255,255,0.9) 50%, rgba(254,243,199,0.5) 100%);
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex flex-col items-center">

  <div class="w-full max-w-md bg-white min-h-screen shadow-xl relative flex flex-col">

    <!-- 상단 헤더 -->
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-gray-200 px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white shadow-sm shadow-indigo-300">
          <i class="fa-solid fa-tags text-sm"></i>
        </div>
        <div>
          <h1 class="text-lg font-black tracking-tight text-gray-900 leading-none">옷라벨</h1>
          <span class="text-[10px] text-indigo-600 font-semibold tracking-wide">SPA 케어라벨 정밀 스펙 비교</span>
        </div>
      </div>
      <button id="open-compare-btn" class="relative text-xs font-bold bg-gray-900 text-white px-3 py-2 rounded-xl flex items-center gap-1.5 active:scale-95 transition-all shadow-sm">
        <i class="fa-solid fa-scale-balanced text-indigo-400"></i>
        <span>맞대결</span>
        <span id="compare-badge" class="bg-indigo-600 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
      </button>
    </header>

    <!-- 검색 & 필터 & 온디맨드 분석기 섹션 -->
    <section class="p-4 border-b border-gray-100 space-y-3 bg-gray-50/70">
      
      <!-- 검색창 -->
      <div class="relative">
        <input type="text" id="search-input" placeholder="상품명, 카테고리, 소재 (예: 캐시미어, 수피마)" 
               class="w-full bg-white border border-gray-200 rounded-xl py-2.5 pl-10 pr-4 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm transition-all">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-gray-400 text-sm"></i>
      </div>

      <!-- 브랜드 필터 버튼 가로 스크롤 -->
      <div class="flex gap-1.5 overflow-x-auto hide-scrollbar py-0.5" id="brand-filters">
        <button class="brand-btn active whitespace-nowrap px-3 py-1.5 rounded-full text-xs font-bold bg-indigo-600 text-white transition-all shadow-sm" data-brand="ALL">전체</button>
        <button class="brand-btn whitespace-nowrap px-3 py-1.5 rounded-full text-xs font-medium bg-white text-gray-600 border border-gray-200 hover:bg-gray-100 transition-all" data-brand="유니클로">유니클로</button>
        <button class="brand-btn whitespace-nowrap px-3 py-1.5 rounded-full text-xs font-medium bg-white text-gray-600 border border-gray-200 hover:bg-gray-100 transition-all" data-brand="ZARA">ZARA</button>
        <button class="brand-btn whitespace-nowrap px-3 py-1.5 rounded-full text-xs font-medium bg-white text-gray-600 border border-gray-200 hover:bg-gray-100 transition-all" data-brand="스파오">스파오</button>
        <button class="brand-btn whitespace-nowrap px-3 py-1.5 rounded-full text-xs font-medium bg-white text-gray-600 border border-gray-200 hover:bg-gray-100 transition-all" data-brand="H&M">H&M</button>
        <button class="brand-btn whitespace-nowrap px-3 py-1.5 rounded-full text-xs font-medium bg-white text-gray-600 border border-gray-200 hover:bg-gray-100 transition-all" data-brand="무신사스탠다드">무탠다드</button>
        <button class="brand-btn whitespace-nowrap px-3 py-1.5 rounded-full text-xs font-medium bg-white text-gray-600 border border-gray-200 hover:bg-gray-100 transition-all" data-brand="탑텐">탑텐</button>
      </div>

      <!-- 정렬(Sort) 필터 탭 -->
      <div class="bg-gray-200/80 p-1 rounded-xl flex items-center justify-between text-xs" id="sort-filters">
        <button class="sort-btn active flex-1 py-1.5 rounded-lg font-bold text-center bg-white text-indigo-700 shadow-sm transition-all" data-sort="recommended">
          추천순
        </button>
        <button class="sort-btn flex-1 py-1.5 rounded-lg font-medium text-center text-gray-600 hover:text-gray-900 transition-all" data-sort="costPerf">
          가성비지수순
        </button>
        <button class="sort-btn flex-1 py-1.5 rounded-lg font-medium text-center text-gray-600 hover:text-gray-900 transition-all" data-sort="score">
          소재점수순
        </button>
        <button class="sort-btn flex-1 py-1.5 rounded-lg font-medium text-center text-gray-600 hover:text-gray-900 transition-all" data-sort="priceAsc">
          낮은가격순
        </button>
      </div>

      <!-- 온디맨드 실시간 케어라벨 즉시 분석기 (아코디언 배너) -->
      <div class="border border-indigo-200/80 bg-gradient-to-r from-indigo-50/90 via-white to-purple-50/90 rounded-2xl overflow-hidden shadow-sm transition-all">
        <button id="toggle-analyzer-btn" class="w-full px-3.5 py-3 flex items-center justify-between text-left hover:bg-white/50 transition-colors">
          <div class="flex items-center gap-2">
            <span class="w-7 h-7 rounded-lg bg-indigo-600 text-white flex items-center justify-center text-xs shadow-sm shadow-indigo-300">
              <i class="fa-solid fa-wand-magic-sparkles"></i>
            </span>
            <div>
              <div class="text-xs font-extrabold text-gray-900 flex items-center gap-1.5">
                <span>실시간 케어라벨 즉시 분석기</span>
                <span class="text-[9px] font-bold bg-indigo-100 text-indigo-700 px-1.5 py-0.2 rounded-full">온디맨드</span>
              </div>
              <p class="text-[10px] text-gray-500">쇼핑몰 혼용률 텍스트를 복사해 붙여넣으면 즉시 계산!</p>
            </div>
          </div>
          <i id="analyzer-arrow" class="fa-solid fa-chevron-down text-xs text-indigo-500 transition-transform duration-300"></i>
        </button>

        <!-- 아코디언 본문 -->
        <div id="analyzer-panel" class="hidden px-3.5 pb-4 pt-1 space-y-3 border-t border-indigo-100/60 bg-white/70">
          <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-gray-700 flex items-center gap-1">
              <i class="fa-solid fa-tag text-indigo-500 text-[10px]"></i>
              <span>케어라벨 혼용률 텍스트 복사/붙여넣기</span>
            </label>
            <textarea id="analyzer-fabric-input" rows="2" 
                      placeholder="예: 울 60%, 캐시미어 10%, 나일론 30% (또는 겉감: 모 80%, 폴리에스터 20%)" 
                      class="w-full p-2.5 text-xs bg-white border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-inner placeholder-gray-400"></textarea>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[11px] font-bold text-gray-700 block mb-1">판매 가격 (원)</label>
              <input type="number" id="analyzer-price-input" placeholder="예: 49900 (선택)" 
                     class="w-full p-2 text-xs bg-white border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
              <label class="text-[11px] font-bold text-gray-700 block mb-1">상품명 / 출처 (선택)</label>
              <input type="text" id="analyzer-name-input" placeholder="예: 24FW 울 니트" 
                     class="w-full p-2 text-xs bg-white border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
          </div>

          <button id="run-analyze-btn" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white text-xs font-extrabold rounded-xl shadow-md shadow-indigo-200 flex items-center justify-center gap-2 transition-all">
            <i class="fa-solid fa-calculator"></i>
            <span>스펙 & 세탁법 즉시 분석하기</span>
          </button>

          <!-- 분석 결과 카드 영역 (초기 숨김) -->
          <div id="analyzer-result-box" class="hidden mt-3 p-3.5 bg-gray-50 border border-indigo-200 rounded-2xl space-y-3">
            <div class="flex items-center justify-between border-b border-gray-200 pb-2">
              <span class="text-[10px] font-extrabold text-indigo-700 bg-indigo-100 px-2 py-0.5 rounded-full">분석 결과 리포트</span>
              <span id="analyzer-costperf-badge" class="text-[10px] font-bold text-gray-600 bg-white border border-gray-200 px-2 py-0.5 rounded-full">가성비 계산 대기</span>
            </div>

            <!-- 소재 점수 & 게이지 -->
            <div>
              <div class="flex justify-between items-center text-xs mb-1">
                <span class="font-bold text-gray-700">소재 퀄리티 점수</span>
                <span class="font-black text-indigo-600 text-sm" id="analyzer-score-text">0점</span>
              </div>
              <div class="w-full bg-gray-200 rounded-full h-2 overflow-hidden shadow-inner">
                <div id="analyzer-gauge-bar" class="bg-indigo-600 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
              </div>
            </div>

            <!-- 추출된 섬유 칩 -->
            <div>
              <span class="text-[10px] text-gray-500 block mb-1">인식된 섬유 비율:</span>
              <div id="analyzer-components-list" class="flex flex-wrap gap-1"></div>
            </div>

            <!-- 세탁 & 케어 팁 -->
            <div class="bg-white p-2.5 rounded-xl border border-gray-200 space-y-1">
              <div class="text-[10px] font-bold text-amber-700 flex items-center gap-1">
                <i class="fa-solid fa-shirt text-amber-500"></i>
                <span>스마트 세탁 & 관리 가이드</span>
              </div>
              <ul id="analyzer-care-tips" class="text-[11px] text-gray-600 list-disc pl-4 space-y-0.5 leading-tight"></ul>
            </div>

            <!-- 맞대결 추가 버튼 -->
            <button id="analyzer-add-compare-btn" class="w-full py-2 bg-gray-900 hover:bg-black text-white text-xs font-bold rounded-xl flex items-center justify-center gap-1.5 shadow-sm active:scale-95 transition-all">
              <i class="fa-solid fa-plus text-indigo-400"></i>
              <span>이 상품을 '맞대결 리스트'에 담기</span>
            </button>
          </div>

          <!-- 최근 분석한 내 라벨 로컬 저장 목록 -->
          <div id="saved-labels-section" class="hidden mt-3">
            <div class="flex items-center justify-between mb-2">
              <span class="text-[11px] font-extrabold text-gray-700 flex items-center gap-1">
                <i class="fa-solid fa-clock-rotate-left text-indigo-500 text-[10px]"></i>
                최근 분석한 내 라벨
              </span>
              <button id="clear-saved-labels-btn" class="text-[10px] text-red-500 hover:text-red-700 font-bold transition-colors">
                전체 삭제
              </button>
            </div>
            <div id="saved-labels-list" class="space-y-1.5 max-h-40 overflow-y-auto hide-scrollbar"></div>
          </div>
        </div>
      </div>

    </section>

    <!-- 상품 카드 리스트 영역 -->
    <main class="flex-1 p-4 overflow-y-auto space-y-3" id="product-container"></main>

    <!-- 하단 상태 고정 바 -->
    <div id="compare-bottom-bar" class="sticky bottom-0 bg-gray-900 text-white p-3.5 flex items-center justify-between border-t border-gray-800 hidden shadow-2xl z-20">
      <div class="text-xs">
        <span class="text-indigo-400 font-bold" id="bottom-bar-count">1</span>개 상품 선택됨
        <span class="text-gray-400 text-[11px] block">(최대 2개 담아 1:1 비교)</span>
      </div>
      <button id="bottom-action-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-3.5 py-2 rounded-lg transition-colors flex items-center gap-1.5 active:scale-95">
        <i class="fa-solid fa-bolt"></i>
        <span>1:1 맞대결 보기</span>
      </button>
    </div>

  </div>

  <!-- 1:1 맞대결 모달 팝업 -->
  <div id="compare-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center hidden">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden transition-all animate-in fade-in duration-200">
      <div class="px-5 py-3.5 border-b border-gray-100 flex items-center justify-between bg-gray-50">
        <div>
          <h2 class="text-sm font-extrabold text-gray-900 flex items-center gap-1.5">
            <i class="fa-solid fa-scale-balanced text-indigo-600"></i>
            라벨 스펙 1:1 맞대결
          </h2>
          <p class="text-[11px] text-gray-500">두 의류의 케어라벨과 가성비를 정밀 대조합니다.</p>
        </div>
        <button id="close-modal-x" class="w-7 h-7 rounded-full bg-gray-200/80 hover:bg-gray-200 flex items-center justify-center text-gray-600 transition-colors">
          <i class="fa-solid fa-xmark text-xs"></i>
        </button>
      </div>

      <div id="modal-content" class="p-4 overflow-y-auto space-y-4"></div>

      <div id="modal-footer" class="p-3 border-t border-gray-100 bg-gray-50 space-y-2">
        <div class="flex gap-2">
          <button id="modal-clear-btn" class="w-1/3 py-2.5 text-xs font-bold text-gray-600 bg-white border border-gray-300 rounded-xl hover:bg-gray-100 transition-colors">
            비교함 비우기
          </button>
          <button id="modal-share-btn" class="w-1/3 py-2.5 text-xs font-bold text-white bg-green-600 hover:bg-green-700 rounded-xl transition-colors flex items-center justify-center gap-1 shadow-sm hidden">
            <i class="fa-solid fa-share-nodes text-[10px]"></i>
            <span>결과 공유</span>
          </button>
          <button id="modal-confirm-btn" class="flex-1 py-2.5 text-xs font-extrabold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 transition-colors shadow-sm">
            확인
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 토스트 메시지 -->
  <div id="toast-message" class="fixed top-16 z-50 bg-gray-900/95 text-white text-xs px-4 py-2.5 rounded-full shadow-xl opacity-0 pointer-events-none transition-all duration-300 transform -translate-y-2"></div>

  <script>
    // =============================================================
    // 1. 설정: 구글 시트 URL & 제휴 마케팅(Affiliate) 설정
    // =============================================================
    const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT-_JrM639eTC06eeehdde2pEcvGo4cuxFGNdoIEXgFJjA0Ba5B_4S3FTMmhRympEOmcTojaqn5LOWP/pub?output=csv";

    // 제휴 마케팅(Affiliate) 링크 래퍼 설정
    // 브랜드 도메인별 제휴 파라미터 또는 리다이렉트 prefix를 설정합니다.
    // 예시: 쿠팡 파트너스, 링크프라이스, 무신사 큐레이터 등
    const AFFILIATE_CONFIG = {
      enabled: true,
      // 도메인 키워드 → 제휴 파라미터 매핑
      rules: [
        {
          // 쿠팡 파트너스 예시
          domainMatch: "coupang.com",
          paramKey: "subid",
          paramValue: "otlabel_ref",
          extraParams: { "redirect": "" }
        },
        {
          // 무신사 큐레이터 예시
          domainMatch: "musinsa.com",
          paramKey: "utm_source",
          paramValue: "otlabel",
          extraParams: { "utm_medium": "affiliate", "utm_campaign": "label_compare" }
        },
        {
          // 범용 UTM 파라미터 (그 외 모든 도메인)
          domainMatch: "*",
          paramKey: "utm_source",
          paramValue: "otlabel",
          extraParams: { "utm_medium": "referral", "utm_campaign": "spa_label" }
        }
      ]
    };

    // localStorage 키 상수
    const LS_KEY_CLICK_STATS = "otlabel_click_stats";
    const LS_KEY_SAVED_LABELS = "otlabel_saved_labels";

    // =============================================================
    // 2. 데모 데이터 & 섬유 가중치 테이블
    // =============================================================
    const DEMO_PRODUCTS = [
      { id: 1, brand: "유니클로", name: "수피마 코튼 크루넥T", price: 19900, fabric: "면(수피마 코튼) 100%", link: "https://www.uniqlo.com", isSponsored: false },
      { id: 2, brand: "ZARA", name: "소프트 니트 스웨터", price: 49900, fabric: "폴리에스터 58%, 아크릴 36%, 울 6%", link: "https://www.zara.com", isSponsored: false },
      { id: 3, brand: "무신사스탠다드", name: "캐시미어 블렌드 라운드넥 니트", price: 58900, fabric: "울 60%, 캐시미어 10%, 나일론 30%", link: "https://www.musinsa.com", isSponsored: false },
      { id: 4, brand: "스파오", name: "클래식 옥스포드 셔츠", price: 29900, fabric: "면 100%", link: "https://spao.com", isSponsored: false },
      { id: 5, brand: "H&M", name: "릴랙스핏 프리미엄 울 블렌드 코트", price: 149000, fabric: "겉감: 울 50%, 폴리에스터 45%, 기타 5% / 안감: 폴리에스터 100%", link: "https://www2.hm.com", isSponsored: false },
      { id: 6, brand: "탑텐", name: "에코 웜 모달 긴팔 티셔츠", price: 15900, fabric: "모달 48%, 면 48%, 폴리우레탄 4%", link: "https://topten.topten10mall.com", isSponsored: false },
      { id: 7, brand: "무신사스탠다드", name: "[시티 레저] 후디드 라이트 다운 재킷 [블랙]", price: 109900, fabric: "겉감: 폴리에스터 100%, 안감: 나일론 100%, 충전재: 덕다운 (오리 솜털 80%, 오리 깃털 20%)", link: "https://www.musinsa.com/products/4356794", isSponsored: false },
      { id: 8, brand: "스파오", name: "[씬라이트] 여성 시어 후드 재킷_SPJPG4TG25", price: 69900, fabric: "겉감: 나일론 100%, 안감: 나일론 100%, 충전재: 폴리에스터 100%", link: "https://www.spao.com/i/item?itemNo=2608016293&lowerVendNo=LV26000002&pageId=1795096632474&preCornerNo=R13720001_categoryItem", isSponsored: false }
    ];

    const FIBER_WEIGHT_TABLE = [
      { regex: /캐시미어|cashmere/i, name: "캐시미어", weight: 100, care: "드라이클리닝 권장, 울 전용 중성세제 미온수 단독 손세탁, 비틀어짜기 금지" },
      { regex: /알파카|alpaca|야크|yak|모헤어|mohair/i, name: "특수모(알파카/야크)", weight: 95, care: "드라이클리닝 권장, 마찰 및 고온 건조 주의" },

    // =============================================================
    // 3. RFC 4180 표준 CSV 파서
    // =============================================================
    function parseCSV(text) {
      const rows = [];
      let currentRow = [];
      let currentField = '';
      let inQuotes = false;
      
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];
        
        if (inQuotes) {
          if (char === '"' && nextChar === '"') {
            currentField += '"';
            i++;
          } else if (char === '"') {
            inQuotes = false;
          } else {
            currentField += char;
          }
        } else {
          if (char === '"') {
            inQuotes = true;
          } else if (char === ',') {
            currentRow.push(currentField);
            currentField = '';
          } else if (char === '\r') {
            if (nextChar === '\n') i++;
            currentRow.push(currentField);
            rows.push(currentRow);
            currentRow = [];
            currentField = '';
          } else if (char === '\n') {
            currentRow.push(currentField);
            rows.push(currentRow);
            currentRow = [];
            currentField = '';
          } else {
            currentField += char;
          }
        }
      }
      if (currentField !== '' || currentRow.length > 0) {
        currentRow.push(currentField);
        rows.push(currentRow);
      }
      return rows;
    }

    // =============================================================
    // 4. 비율(%) 기반 정밀 소재 점수 엔진
    // =============================================================
    function extractOuterFabric(str) {
      if (!str) return "";
      const outerMatch = str.match(/(?:겉감|표면|본체)\s*[:\]]?\s*([^/\[\n]+)/i);
      if (outerMatch && outerMatch[1]) return outerMatch[1].trim();
      return str;
    }

    function analyzeFabricEngine(fabricStr) {
      if (!fabricStr || typeof fabricStr !== "string") {
        return { score: 50, components: [], careTips: ["케어라벨 정보가 입력되지 않았습니다."], grade: "정보없음" };
      }

      const outerStr = extractOuterFabric(fabricStr);
      const regex = /([가-힣a-zA-Z]+)\s*(\d+)\s*%/g;
      const matches = [...outerStr.matchAll(regex)];
      
      const components = [];
      let totalPercent = 0;
      let weightedSum = 0;
      const tipSet = new Set();

      for (const m of matches) {
        const rawName = m[1].trim();
        const percent = parseInt(m[2], 10);
        if (isNaN(percent) || percent <= 0) continue;

        const matchedFiber = FIBER_WEIGHT_TABLE.find(f => f.regex.test(rawName));
        const weight = matchedFiber ? matchedFiber.weight : 45;
        const displayName = matchedFiber ? matchedFiber.name : rawName;
        const care = matchedFiber ? matchedFiber.care : "표준 세탁법 준수";

        components.push({ name: displayName, rawName, percent, weight });
        weightedSum += (percent * weight);
        totalPercent += percent;
        tipSet.add(`${displayName}: ${care}`);
      }

      let score = 50;
      if (totalPercent > 0) {
        score = Math.round(weightedSum / totalPercent);
      } else {
        let sumW = 0, count = 0;
        for (const item of FIBER_WEIGHT_TABLE) {
          if (item.regex.test(outerStr)) { sumW += item.weight; count++; tipSet.add(`${item.name}: ${item.care}`); }
        }
        if (count > 0) score = Math.round(sumW / count);
      }

      score = Math.max(15, Math.min(100, score));

      let grade = "보통";
      if (score >= 88) grade = "최상급 천연";
      else if (score >= 75) grade = "우수 퀄리티";
      else if (score >= 60) grade = "실용 혼방";
      else grade = "가성비 합섬";

      let careTips = Array.from(tipSet);
      if (careTips.length === 0) careTips = ["중성세제를 사용한 일반 미온수 세탁을 권장합니다."];

      return { score, components, careTips, grade, isOuterOnly: outerStr !== fabricStr };
    }

    function calculateCostPerformance(score, price) {
      if (!price || price <= 0) return 0;
      return Math.round((score / price) * 10000 * 10) / 10;
    }

    // =============================================================
    // 5. 제휴 마케팅 아웃바운드 링크 래퍼 & 클릭 트래킹
    // =============================================================
    function buildAffiliateLink(originalUrl) {
      if (!AFFILIATE_CONFIG.enabled || !originalUrl || originalUrl === "#") return originalUrl;
      try {
        const url = new URL(originalUrl);
        // 도메인 매칭 — 구체적인 규칙 먼저, 범용(*) 규칙은 최후에
        let matchedRule = null;
        for (const rule of AFFILIATE_CONFIG.rules) {
          if (rule.domainMatch === "*") { matchedRule = matchedRule || rule; continue; }
          if (url.hostname.includes(rule.domainMatch)) { matchedRule = rule; break; }
        }
        if (matchedRule) {
          url.searchParams.set(matchedRule.paramKey, matchedRule.paramValue);
          if (matchedRule.extraParams) {
            for (const [k, v] of Object.entries(matchedRule.extraParams)) {
              if (v !== "") url.searchParams.set(k, v);
            }
          }
        }
        return url.toString();
      } catch (e) {
        return originalUrl;
      }
    }

    function trackOutboundClick(brand, productName) {
      console.log(`[옷라벨 Affiliate] 아웃바운드 클릭 → 브랜드: ${brand}, 상품: ${productName}`);
      try {
        const stats = JSON.parse(localStorage.getItem(LS_KEY_CLICK_STATS) || "{}");
        const key = `${brand}||${productName}`;
        stats[key] = (stats[key] || 0) + 1;
        stats._totalClicks = (stats._totalClicks || 0) + 1;
        stats._lastClickAt = new Date().toISOString();
        localStorage.setItem(LS_KEY_CLICK_STATS, JSON.stringify(stats));
      } catch (e) { /* localStorage 사용 불가 환경 대비 */ }
    }

    // 전역 클릭 핸들러: 카드 렌더링에서 onclick으로 호출
    window.handleOutboundClick = function(brand, productName, originalLink) {
      trackOutboundClick(brand, productName);
      const affiliateUrl = buildAffiliateLink(originalLink);
      window.open(affiliateUrl, "_blank", "noopener,noreferrer");
    };

    // =============================================================
    // 6. 최근 분석한 내 라벨 로컬 저장 (LocalStorage)
    // =============================================================
    function loadSavedLabels() {
      try {
        const data = JSON.parse(localStorage.getItem(LS_KEY_SAVED_LABELS) || "[]");
        return Array.isArray(data) ? data : [];
      } catch (e) { return []; }
    }

    function saveLabelToStorage(item) {
      try {
        const list = loadSavedLabels();
        // 중복 방지 (같은 fabric + name이면 업데이트)
        const existIdx = list.findIndex(l => l.fabric === item.fabric && l.name === item.name);
        const entry = {
          id: item.id,
          name: item.name,
          price: item.price,
          fabric: item.fabric,
          score: item.score,
          costPerf: item.costPerf,
          grade: item.analysis?.grade || "",
          savedAt: new Date().toISOString()
        };
        if (existIdx > -1) {
          list[existIdx] = entry;
        } else {
          list.unshift(entry);
        }
        // 최대 20개까지만 유지
        if (list.length > 20) list.length = 20;
        localStorage.setItem(LS_KEY_SAVED_LABELS, JSON.stringify(list));
      } catch (e) { /* localStorage 사용 불가 환경 대비 */ }
    }

    function deleteSavedLabel(savedId) {
      try {
        let list = loadSavedLabels();
        list = list.filter(l => l.id !== savedId);
        localStorage.setItem(LS_KEY_SAVED_LABELS, JSON.stringify(list));
      } catch (e) {}
    }

    function clearAllSavedLabels() {
      try { localStorage.removeItem(LS_KEY_SAVED_LABELS); } catch (e) {}
    }

    function restoreSavedLabelsToProducts() {
      const saved = loadSavedLabels();
      saved.forEach(s => {
        if (!products.some(p => p.id === s.id)) {
          const analysis = analyzeFabricEngine(s.fabric);
          products.push({
            id: s.id,
            brand: "자체분석",
            name: s.name,
            price: s.price || 0,
            fabric: s.fabric,
            analysis: analysis,
            score: analysis.score,
            costPerf: calculateCostPerformance(analysis.score, s.price || 0),
            link: "#",
            isSponsored: false,
            _fromSaved: true
          });
        }
      });
    }

    function renderSavedLabelsUI() {
      const section = document.getElementById("saved-labels-section");
      const listEl = document.getElementById("saved-labels-list");
      const saved = loadSavedLabels();

      if (saved.length === 0) {
        section.classList.add("hidden");

      saved.forEach(s => {

    window.handleDeleteSavedLabel = function(savedId) {
      deleteSavedLabel(savedId);
      // 상품 목록에서도 제거
      products = products.filter(p => !(p.id === savedId && p._fromSaved));
      renderSavedLabelsUI();
      renderProductCards();
      showToast("저장된 분석 라벨이 삭제되었습니다.");
    };

    window.handleRestoreSavedToCompare = function(savedId) {
      const item = products.find(p => p.id === savedId);
      if (!item) return;
      const idx = compareList.findIndex(p => p.id === savedId);
      if (idx === -1 && compareList.length >= 2) {
        showToast("맞대결은 최대 2개 상품까지만 가능합니다!");
        return;
      }
      if (idx === -1) {
        compareList.push(item);
        showToast(`'${item.name}'이(가) 맞대결에 담겼습니다!`);
      } else {
        showToast("이미 맞대결 리스트에 담겨 있습니다.");
      }
      updateCompareUI();
      renderProductCards();
    };

    // =============================================================
    // 7. 맞대결 결과 공유 & 딥링크 (바이럴 루프)
    // =============================================================
    function generateShareLink() {
      if (compareList.length !== 2) return null;
      const ids = compareList.map(p => p.id).join(",");
      const url = new URL(window.location.href.split("?")[0]);
      url.searchParams.set("compare", ids);
      return url.toString();
    }

    function generateShareText() {
      if (compareList.length !== 2) return "";
      const [a, b] = compareList;
      const winner = a.score > b.score ? a : (b.score > a.score ? b : null);
      const winnerText = winner ? `승자는 ${winner.brand}!` : "무승부!";
      return `[옷라벨 1:1 맞대결] ${a.brand} vs ${b.brand}, ${winnerText}\n소재점수 ${a.score} vs ${b.score} | 가성비 ${a.costPerf} vs ${b.costPerf}\n`;
    }

    async function shareCompareResult() {
      const link = generateShareLink();
      const text = generateShareText();
      if (!link) {
        showToast("2개 상품을 담아야 공유할 수 있습니다.");
        return;
      }
      const fullText = text + link;
      try {
        await navigator.clipboard.writeText(fullText);
        showToast("맞대결 링크가 복사되었습니다! 카톡에 붙여넣기 하세요 🔗");
      } catch (e) {
        // Clipboard API 미지원 Fallback
        const textarea = document.createElement("textarea");
        textarea.value = fullText;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand("copy");
          showToast("맞대결 링크가 복사되었습니다! 카톡에 붙여넣기 하세요 🔗");
        } catch (e2) {
          showToast("복사에 실패했습니다. 직접 URL을 복사해 주세요.");
        }
        document.body.removeChild(textarea);
      }
    }

    function handleDeepLinkOnLoad() {
      const params = new URLSearchParams(window.location.search);
      const compareParam = params.get("compare");
      if (!compareParam) return;

      const ids = compareParam.split(",").map(s => parseInt(s.trim(), 10)).filter(n => !isNaN(n));
      if (ids.length === 0) return;

      // 데이터 로드 후 실행되어야 하므로 약간의 지연
      setTimeout(() => {
        compareList = [];
        ids.slice(0, 2).forEach(id => {
          const item = products.find(p => p.id === id);
          if (item && !compareList.some(c => c.id === item.id)) {
            compareList.push(item);
          }
        });
        if (compareList.length > 0) {
          updateCompareUI();
          renderProductCards();
          openModal();
        }
      }, 300);
    }

    // =============================================================

    let products = [];

    // =============================================================
    // 9. 데이터 로드 (캐시 버스팅 & isSponsored 지원)
    // =============================================================
    async function initData() {
      const container = document.getElementById("product-container");
      container.innerHTML = `
        <div class="text-center py-16 text-gray-400 text-xs">
          <i class="fa-solid fa-circle-notch fa-spin text-3xl text-indigo-500 mb-3"></i>
          <p class="font-bold text-gray-600">옷라벨 데이터를 정밀 분석하며 로드하는 중...</p>
        </div>
      `;

      try {
        if (!GOOGLE_SHEET_CSV_URL || GOOGLE_SHEET_CSV_URL.includes("여기에_구글시트")) {
          products = DEMO_PRODUCTS.map(p => {
            const analysis = analyzeFabricEngine(p.fabric);
            return {
              ...p,
              analysis,
              score: analysis.score,
              costPerf: calculateCostPerformance(analysis.score, p.price)
            };
          });
        } else {
          // Cache Busting: 타임스탬프 쿼리 추가
          const separator = GOOGLE_SHEET_CSV_URL.includes("?") ? "&" : "?";
          const fetchUrl = `${GOOGLE_SHEET_CSV_URL}${separator}t=${Date.now()}`;
          const res = await fetch(fetchUrl);
          const text = await res.text();
          const rows = parseCSV(text);
          
          // 열 구조: [brand, name, price, fabric, link, isSponsored]
          const sheetProducts = rows.slice(1).filter(r => r[0] && r[1]).map((r, idx) => {
            const price = parseInt(r[2]?.replace(/[^0-9]/g, "")) || 0;
            const fabric = r[3]?.trim() || "정보 없음";
            const analysis = analyzeFabricEngine(fabric);
            const sponsoredRaw = (r[5] || "").trim().toUpperCase();
            const isSponsored = (sponsoredRaw === "TRUE" || sponsoredRaw === "Y");
            return {
              id: idx + 1,
              brand: r[0]?.trim(),
              name: r[1]?.trim(),
              price,
              fabric,
              analysis,
              score: analysis.score,
              costPerf: calculateCostPerformance(analysis.score, price),
              link: r[4]?.trim() || "#",
              isSponsored
            };
          });

          // 구글 시트에 아직 반영되지 않은 신규 데모 상품(무신사, 스파오 등)이 있다면 뒤에 자동 병합
          let maxId = sheetProducts.length;
          const merged = [...sheetProducts];
          DEMO_PRODUCTS.forEach(dp => {
            const exists = sheetProducts.some(sp => sp.name === dp.name || (dp.link !== "#" && sp.link === dp.link));
            if (!exists) {
              maxId++;
              const analysis = analyzeFabricEngine(dp.fabric);
              merged.push({
                ...dp,
                id: maxId,
                analysis,
                score: analysis.score,
                costPerf: calculateCostPerformance(analysis.score, dp.price)
              });
            }
          });
          products = merged;
        }
      } catch (err) {
        console.error("데이터 로드 실패, 데모 데이터로 복구:", err);
        products = DEMO_PRODUCTS.map(p => {
          const analysis = analyzeFabricEngine(p.fabric);
          return { ...p, analysis, score: analysis.score, costPerf: calculateCostPerformance(analysis.score, p.price) };
        });
      }

      // localStorage에서 저장된 분석 라벨 복원
      restoreSavedLabelsToProducts();
      renderSavedLabelsUI();
      renderProductCards();

      // 딥링크 처리 (?compare=1,3)
      handleDeepLinkOnLoad();
    }

    // =============================================================
    // 10. 상품 카드 렌더링 (스폰서 뱃지, 게이지, Affiliate 링크)
    // =============================================================
    function renderProductCards() {
      const container = document.getElementById("product-container");
      container.innerHTML = "";

      const term = document.getElementById("search-input").value.trim().toLowerCase();
      
      let filtered = products.filter(p => {
        const matchBrand = selectedBrand === "ALL" || p.brand === selectedBrand;
        const matchSearch = p.name.toLowerCase().includes(term) || p.fabric.toLowerCase().includes(term);
        return matchBrand && matchSearch;
      });

      // 정렬(Sort) 적용 — 추천순일 때 스폰서 상품 최상단 우선
      filtered.sort((a, b) => {
        if (selectedSort === "costPerf") return b.costPerf - a.costPerf;
        if (selectedSort === "score") return b.score - a.score;
        if (selectedSort === "priceAsc") return a.price - b.price;
        // 추천순: 스폰서 최상단, 그 외 id 순
        if (a.isSponsored && !b.isSponsored) return -1;
        if (!a.isSponsored && b.isSponsored) return 1;
        return a.id - b.id;
      });

    window.toggleCompare = function(id) {
      const item = products.find(p => p.id === id);
      if (!item) return;

      const index = compareList.findIndex(p => p.id === id);

      if (index > -1) {
        compareList.splice(index, 1);
        showToast("비교함에서 제거되었습니다.");
      } else {
        if (compareList.length >= 2) {
          showToast("맞대결은 최대 2개 상품까지만 가능합니다!");
          return;
        }
        compareList.push(item);
        showToast(`'${item.brand}' 상품이 맞대결에 담겼습니다.`);
      }

      updateCompareUI();
      renderProductCards();
    };

    // =============================================================
    // 13. 온디맨드 분석기 이벤트 (localStorage 자동 저장 연동)
    // =============================================================
    const toggleAnalyzerBtn = document.getElementById("toggle-analyzer-btn");
    const analyzerPanel = document.getElementById("analyzer-panel");
    const analyzerArrow = document.getElementById("analyzer-arrow");
    const runAnalyzeBtn = document.getElementById("run-analyze-btn");
    const analyzerResultBox = document.getElementById("analyzer-result-box");
    const analyzerAddCompareBtn = document.getElementById("analyzer-add-compare-btn");

    toggleAnalyzerBtn.addEventListener("click", () => {
      const isHidden = analyzerPanel.classList.contains("hidden");
      if (isHidden) {
        analyzerPanel.classList.remove("hidden");
        analyzerArrow.classList.add("rotate-180");
      } else {
        analyzerPanel.classList.add("hidden");
        analyzerArrow.classList.remove("rotate-180");
      }
    });

    runAnalyzeBtn.addEventListener("click", () => {
      const fabricText = document.getElementById("analyzer-fabric-input").value.trim();
      const priceVal = parseInt(document.getElementById("analyzer-price-input").value.trim(), 10) || 0;
      const nameVal = document.getElementById("analyzer-name-input").value.trim() || "직접 분석한 의류";

      if (!fabricText) {
        showToast("혼용률 텍스트를 입력하거나 붙여넣어 주세요!");
        document.getElementById("analyzer-fabric-input").focus();
        return;
      }

      const analysis = analyzeFabricEngine(fabricText);
      const costPerf = calculateCostPerformance(analysis.score, priceVal);

      analyzerResultBox.classList.remove("hidden");
      document.getElementById("analyzer-score-text").innerText = `${analysis.score}점 (${analysis.grade})`;
      document.getElementById("analyzer-gauge-bar").style.width = `${analysis.score}%`;
      
      const costPerfBadge = document.getElementById("analyzer-costperf-badge");
      if (priceVal > 0) {
        costPerfBadge.innerText = `가성비 지수 ${costPerf} pt`;
        costPerfBadge.className = "text-[10px] font-bold text-indigo-700 bg-indigo-100 border border-indigo-200 px-2 py-0.5 rounded-full";
      } else {
        costPerfBadge.innerText = "가격 미입력 (가성비 산출 생략)";
        costPerfBadge.className = "text-[10px] font-medium text-gray-500 bg-gray-100 px-2 py-0.5 rounded-full";
      }

      const compList = document.getElementById("analyzer-components-list");
      compList.innerHTML = "";
      if (analysis.components.length > 0) {
        analysis.components.forEach(c => {
          const chip = document.createElement("span");
          chip.className = "text-[10px] font-bold bg-white text-gray-700 border border-gray-300 px-2 py-0.5 rounded-md shadow-xs";
          chip.innerText = `${c.name} ${c.percent}%`;
          compList.appendChild(chip);
        });
      } else {
        compList.innerHTML = `<span class="text-[10px] text-gray-500">정규 백분율 미포함 (키워드 가중치 기반 산출)</span>`;
      }

      const tipsList = document.getElementById("analyzer-care-tips");
      tipsList.innerHTML = "";
      analysis.careTips.forEach(tip => {
        const li = document.createElement("li");
        li.innerText = tip;
        tipsList.appendChild(li);
      });

      customProductCounter++;
      latestAnalyzedCustom = {
        id: customProductCounter,
        brand: "자체분석",
        name: nameVal,
        price: priceVal,
        fabric: fabricText,
        analysis: analysis,
        score: analysis.score,
        costPerf: costPerf,
        link: "#",
        isSponsored: false
      };

      // 자동으로 localStorage에 저장
      saveLabelToStorage(latestAnalyzedCustom);
      renderSavedLabelsUI();

      showToast("소재 스펙 분석 완료 & 자동 저장됨!");
    });

    analyzerAddCompareBtn.addEventListener("click", () => {
      if (!latestAnalyzedCustom) return;

      if (!products.some(p => p.id === latestAnalyzedCustom.id)) {
        products.unshift(latestAnalyzedCustom);
      }

      const index = compareList.findIndex(p => p.id === latestAnalyzedCustom.id);
      if (index === -1 && compareList.length >= 2) {
        showToast("맞대결은 최대 2개 상품까지만 가능합니다!");
        return;
      }

      if (index === -1) {
        compareList.push(latestAnalyzedCustom);
        showToast(`'${latestAnalyzedCustom.name}'이(가) 맞대결에 담겼습니다!`);
      } else {
        showToast("이미 맞대결 리스트에 담겨 있습니다.");
      }

      updateCompareUI();
      renderProductCards();
    });

    // 저장된 라벨 전체 삭제
    document.getElementById("clear-saved-labels-btn").addEventListener("click", () => {
      clearAllSavedLabels();
      products = products.filter(p => !p._fromSaved);
      renderSavedLabelsUI();
      renderProductCards();
      showToast("저장된 분석 라벨이 모두 삭제되었습니다.");
    });

    // =============================================================
    // 14. 이벤트 리스너 등록
    // =============================================================
    document.getElementById("open-compare-btn").addEventListener("click", openModal);
    document.getElementById("bottom-action-btn").addEventListener("click", openModal);
    document.getElementById("close-modal-x").addEventListener("click", closeModal);
    document.getElementById("modal-confirm-btn").addEventListener("click", closeModal);

    // 맞대결 결과 공유 버튼
    document.getElementById("modal-share-btn").addEventListener("click", shareCompareResult);

    document.getElementById("modal-clear-btn").addEventListener("click", () => {
      compareList = [];
      updateCompareUI();
      renderProductCards();
      openModal();
    });

    document.getElementById("compare-modal").addEventListener("click", (e) => {
      if (e.target.id === "compare-modal") closeModal();
    });

    document.getElementById("search-input").addEventListener("input", renderProductCards);

    // 브랜드 필터 버튼 이벤트
    document.querySelectorAll(".brand-btn").forEach(btn => {
      btn.addEventListener("click", (e) => {
        document.querySelectorAll(".brand-btn").forEach(b => {
          b.className = "brand-btn whitespace-nowrap px-3 py-1.5 rounded-full text-xs font-medium bg-white text-gray-600 border border-gray-200 hover:bg-gray-100 transition-all";
        });
        e.currentTarget.className = "brand-btn active whitespace-nowrap px-3 py-1.5 rounded-full text-xs font-bold bg-indigo-600 text-white transition-all shadow-sm";
        selectedBrand = e.currentTarget.dataset.brand;
        renderProductCards();
      });
    });

    // 정렬(Sort) 버튼 이벤트
    document.querySelectorAll(".sort-btn").forEach(btn => {
      btn.addEventListener("click", (e) => {
        document.querySelectorAll(".sort-btn").forEach(b => {
          b.className = "sort-btn flex-1 py-1.5 rounded-lg font-medium text-center text-gray-600 hover:text-gray-900 transition-all";
        });
        e.currentTarget.className = "sort-btn active flex-1 py-1.5 rounded-lg font-bold text-center bg-white text-indigo-700 shadow-sm transition-all";
        selectedSort = e.currentTarget.dataset.sort;
        renderProductCards();
      });
    });

    // =============================================================
    // 15. 앱 시작
    // =============================================================
    initData();
  </script>
</body>
</html>
