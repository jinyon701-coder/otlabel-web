name: Otlabel Auto Care-Label Crawler

# on:
#   schedule:
#     # [법률 자문 P0 조치] 브랜드별 이용약관 및 자동 접근권한 사전 확인 전까지 무단 자동 크롤링 비활성화
#     # 매일 한국 시간(KST) 새벽 6시 실행 (UTC 21:00)
#     # - cron: '0 21 * * *'
#   workflow_dispatch: # GitHub 웹 UI에서 수동 즉시 실행 버튼 지원

on:
  workflow_dispatch: # [법률 자문 P0 준수] 운영자 승인 하에 수동 즉시 실행만 허용

jobs:
  crawl-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 파이썬 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Playwright Chromium 브라우저 및 시스템 의존성 설치
        run: |
          playwright install --with-deps chromium

      - name: SPA 케어라벨 정보 자동 수집 및 구글 시트 동기화
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          python crawler.py
